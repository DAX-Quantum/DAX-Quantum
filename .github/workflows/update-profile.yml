name: Auto Update Profile & Terminal

on:
  schedule:
    # Runs every 6 hours to check for new repositories
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  repository_dispatch:
    types: [update-projects]
  push:
    branches:
      - main
    paths:
      - 'generate_terminal.py'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch repositories and generate updated terminal & README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_terminal.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md terminal.svg
          if git diff --staged --quiet; then
            echo "Profile is already up-to-date. No changes needed."
          else
            git commit -m "Auto-update projects and terminal [skip ci]"
            git push
          fi
